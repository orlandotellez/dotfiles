onboarding = false

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent = "#E11A45"
red = "#E11A45"
selection_bg = "#E11A45"
active_row_bg = "#E11A45"
surface_dim = "#1A1A1A"
surface0 = "#000000"
surface1 = "#1A1A1A"
overlay0 = "#ffffff"
overlay1 = "#ffffff"
text = "#ffffff"
subtext0 = "#ffffff"
panel_bg = "#000000"

[ui]
agent_panel_sort = "priority"
tab_bar_position = "top"

[keys]
prefix = "ctrl+a"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
